version: '3.8'

services:
  # 1. On-Premise LLM Inference Engine (vLLM с поддержкой NVIDIA GPU)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: enterprise-vllm
    runtime: nvidia
    restart: unless-stopped
    environment:
      - HUGGING_FACE_HUB_TOKEN=""
    command: >
      --model Qwen/Qwen2.5-14B-Instruct-AWQ
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/root/.cache/huggingface

  # 2. Векторная база данных Qdrant для RAG по ГОСТам и DWG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  # 3. Мультиагентный бекенд (DLP Страж + Инженер RAG + CEO)
  multiagent-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: enterprise-multiagent
    restart: unless-stopped
    environment:
      - VLLM_URL=http://vllm:8000/v1
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8080:8080"
    depends_on:
      - vllm
      - qdrant

  # 4. Open WebUI для 15 сотрудников с RBAC авторизацией
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: enterprise-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=local-secret-token
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
    volumes:
      - ./data/openwebui:/app/backend/data
    depends_on:
      - vllm
